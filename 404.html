<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Wrong trail · Wild West Barbershop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital@1&display=swap" rel="stylesheet">
<!-- chemins absolus : cette page est servie à n'importe quelle adresse introuvable -->
<link rel="stylesheet" href="/css/style.css">
<style>
  .nf { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .nf-card { max-width:520px; width:100%; text-align:center; padding:34px 22px 30px; }
  .nf-code { font-size:84px; font-weight:900; line-height:1; letter-spacing:6px; color:#7a4a1a; }
  .nf-title { margin-top:10px; font-size:22px; font-weight:700; letter-spacing:1px; color:var(--ink); }
  .nf-sub { margin-top:10px; font-family:'EB Garamond',Georgia,serif; font-style:italic; font-size:17px; color:var(--ink-soft); }
  .nf-card .book-cta { display:inline-block; margin-top:22px; padding:15px 34px; }
</style></head>
<body>
  <div class="page-bg"></div>
  <div class="page-scrim"></div>
  <main class="nf">
    <div class="item nf-card">
      <div class="nf-code">404</div>
      <h1 class="nf-title">Looks like you've taken the wrong trail.</h1>
      <p class="nf-sub">Nothing out here but dust and cactus. Let's head back to town.</p>
      <a class="book-cta btn3d" href="/">Back to the shop</a>
    </div>
  </main>
</body></html>
