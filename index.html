<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Wild West Barbershop Bali — Cut, Shave, Groom. Classic cuts, fades, razor shaves and WildWest packages.">
<title>Wild West Barbershop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital@1&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body class="lang-en">
  <div class="splash" id="splash">
    <div class="splash-bg"></div>
    <div class="splash-scrim"></div>
    <div class="splash-content">
      <div class="splash-spacer"></div>
      <div class="splash-main">
        <div class="splash-logo-wrap">
          <div class="logo-spin logo-spin--splash">
            <div class="logo-frame">
              <img src="images/logo.jpg" alt="Wild West Barbershop">
            </div>
          </div>
        </div>
      </div>
      <div class="splash-hint-zone">
        <div class="splash-hint btn3d" data-t="splashHint"></div>
      </div>
      <div class="splash-credit">narinagi digital services</div>
    </div>
  </div>

  <div class="page-bg"></div>
  <div class="page-scrim"></div>

  <div class="page">
    <div class="page-header">
      <div class="logo-spin logo-spin--header">
        <div class="logo-frame">
          <img src="images/logo.jpg" alt="Wild West Barbershop">
        </div>
      </div>
    </div>

    <div class="lang-switch" role="group" aria-label="Language">
      <button class="lang-btn" data-lang="id" lang="id">ID</button>
      <button class="lang-btn active" data-lang="en" lang="en">EN</button>
      <button class="lang-btn" data-lang="ru" lang="ru">RU</button>
      <button class="lang-btn" data-lang="zh" lang="zh-Hans">中文</button>
      <button class="lang-btn" data-lang="fr" lang="fr">FR</button>
    </div>

    <div class="quick-links">
      <a class="btn3d" href="https://maps.app.goo.gl/5sfg58Nj1jkyGAoL7" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-11.5A7 7 0 0 1 19 9.5C19 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
        <span data-t="linkLocation"></span>
      </a>
      <a class="btn3d" href="https://www.instagram.com/wildwestbarbershopbali/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
        <span data-t="linkInstagram"></span>
      </a>
      <a class="btn3d" data-wa href="https://wa.me/6282144834392" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M20.5 11.9a8.4 8.4 0 0 1-12.3 7.4L4 20.5l1.3-4a8.4 8.4 0 1 1 15.2-4.6z"/><path d="M8.5 8.9c.2-.5.5-.5.8-.5h.6c.2 0 .4 0 .6.5s.7 1.7.8 1.8.1.3 0 .5-.2.3-.4.5-.4.4-.2.7c.2.3.9 1.4 1.9 2.2 1.3 1 2.3 1.3 2.6 1.4s.5 0 .7-.2.8-.9 1-1.2.5-.2.8-.1l1.6.8c.2.1.4.2.4.4s0 1-.4 1.4-1.5 1.2-2.9 1.1-3.9-1.1-5.3-2.8-2-3.3-2.1-3.5"/></svg>
        <span data-t="linkWhatsApp"></span>
      </a>
    </div>

    <div class="tabs-wrap" id="tabs-wrap">
      <div class="tabs-scroll" id="tabs-scroll"></div>
    </div>

    <noscript><p class="reviews-sub">Please enable JavaScript to view the menu.</p></noscript>

    <!-- Menus (Cuts, Grooming, Packages, Grit & Goods, Drinks) : générés par js/render.js depuis js/menu-data.js -->
    <div id="menu-root"></div>

    <!-- Avis Google : données dans js/reviews-data.js -->
    <div class="panel" id="panel-reviews">
      <div class="panel-title"><span class="panel-mark"></span><span class="panel-title-text" data-t="reviewsTitle"></span></div>
      <p class="reviews-sub" data-t="reviewsSub"></p>
      <div class="rating-card item">
        <div class="rating-stars" aria-hidden="true">★★★★★</div>
        <div class="rating-num"><span class="js-rating"></span><small>/ 5</small></div>
        <div class="rating-count" data-t="reviewsBased"></div>
        <a class="book-cta btn3d js-maps" href="#" target="_blank" rel="noopener" data-t="reviewsReadAll"></a>
      </div>
      <div class="review-list"></div>
      <template id="review-template">
        <div class="item review-card">
          <div class="review-head"><span class="review-name"></span><span class="review-stars" aria-label="5 stars"></span></div>
          <div class="review-text"></div>
          <div class="review-foot">
            <span class="review-meta"><span class="review-date"></span><span class="review-translated" data-t="reviewsTranslated"></span></span>
            <a class="review-link" href="#" target="_blank" rel="noopener" data-t="reviewsView"></a>
          </div>
        </div>
      </template>
    </div>

    <!-- Galerie -->
    <div class="panel" id="panel-gallery">
      <div class="panel-title"><span class="panel-mark"></span><span class="panel-title-text" data-t="titleGallery"></span></div>
      <div class="gallery"><img src="images/client-1.jpg" alt="Wild West Barbershop Bali — Before and after: a fresh cut" loading="lazy"><img src="images/client-2.jpg" alt="Wild West Barbershop Bali — Beard trim and clean-up" loading="lazy"><img src="images/chair.jpg" alt="Wild West Barbershop Bali — Vintage barber chair" loading="lazy"><img src="images/lounge.jpg" alt="Wild West Barbershop Bali — Waiting lounge" loading="lazy"><img src="images/tools.jpg" alt="Wild West Barbershop Bali — Our tools" loading="lazy"><img src="images/chair-back.jpg" alt="Wild West Barbershop Bali — The chair by the window" loading="lazy"></div>
      <a class="book-cta btn3d" data-wa href="https://wa.me/6282144834392" target="_blank" rel="noopener" data-t="bookWhatsApp"></a>
    </div>

    <div class="foot"><div class="foot-text">narinagi digital services</div></div>
  </div>

  <script src="js/translations.js"></script>
  <script src="js/menu-data.js"></script>
  <script src="js/reviews-data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/main.js"></script>
</body></html>
